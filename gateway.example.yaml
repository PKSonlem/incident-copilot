# Пример конфигурации гейтвея. Секреты здесь не хранятся: только имена переменных окружения.
redis:
  addr: redis:6379
cache:
  ttl: 1h # срок жизни записей точного кэша ответов (по умолчанию 1h)
providers:
  - name: local
    kind: openai
    base_url: http://host.docker.internal:7382
  - name: anthropic
    kind: claude
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
models:
  - name: local-small
    provider: local
    provider_model: agent
  - name: claude-sonnet
    provider: anthropic
    provider_model: claude-sonnet-4-5
clients:
  - name: agent
    key_env: GATEWAY_CLIENT_KEY
    rate_limit:
      requests: 60
      window: 1m
