services:
  redis:
    image: redis:7-alpine
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    mem_limit: 128m
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
