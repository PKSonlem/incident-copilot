services:
  redis:
    image: redis:7-alpine
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    mem_limit: 128m
    environment:
      CONFIG_PATH: /etc/gateway/gateway.yaml
      GATEWAY_CLIENT_KEY: ${GATEWAY_CLIENT_KEY:?задайте GATEWAY_CLIENT_KEY}
    volumes:
      - ./gateway.example.yaml:/etc/gateway/gateway.yaml:ro
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
